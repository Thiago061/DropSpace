services:
  database:
    image: postgis/postgis:16-3.4
    container_name: zonageo-postgis
    restart: unless-stopped
    environment:
      POSTGRES_DB: zonageo
      POSTGRES_USER: zonageo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zonageo_dev}
    ports:
      - "5432:5432"
    volumes:
      - zonageo_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zonageo -d zonageo"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  zonageo_data:
