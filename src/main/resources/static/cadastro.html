<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Criar conta — DropSpace</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app-header"></div>
  <main id="conteudo" class="container page">
    <section class="panel narrow">
      <ol class="steps" aria-label="Etapas do cadastro"><li aria-current="step">1. Seus dados</li><li>2. Seus interesses</li></ol>
      <h1>Crie sua conta</h1>
      <p class="muted">Leva menos de 1 minuto. Todos os campos são obrigatórios.</p>
      <form id="regForm" novalidate>
        <div class="two">
          <div><label for="firstName">Nome</label><input id="firstName" autocomplete="given-name" required><p class="field-err" id="firstName-err" role="alert"></p></div>
          <div><label for="lastName">Sobrenome</label><input id="lastName" autocomplete="family-name" required><p class="field-err" id="lastName-err" role="alert"></p></div>
        </div>
        <label for="cpf">CPF</label><input id="cpf" inputmode="numeric" maxlength="14" placeholder="000.000.000-00" autocomplete="off" required><p class="field-err" id="cpf-err" role="alert"></p>
        <label for="cep">CEP</label><input id="cep" inputmode="numeric" maxlength="9" placeholder="00000-000" autocomplete="postal-code" required>
        <p class="field-err" id="cep-err" role="alert"></p><p class="hint" id="addr" role="status" aria-live="polite"></p>
        <label for="email">E-mail</label><input id="email" type="email" autocomplete="email" required><p class="field-err" id="email-err" role="alert"></p>
        <label for="password">Senha <span class="muted">(6 a 8 caracteres)</span></label>
        <div class="pw"><input id="password" type="password" maxlength="8" autocomplete="new-password" data-noclipboard required><button type="button" class="pw__toggle" aria-pressed="false" aria-label="Mostrar senha">👁</button></div>
        <p class="hint">Por segurança, copiar e colar está desativado neste campo.</p><p class="field-err" id="password-err" role="alert"></p>
        <p id="formErr" class="err" role="alert"></p>
        <button class="btn btn--accent btn--block" type="submit" id="regSubmit">Continuar</button>
      </form>
      <p class="center">Já tem conta? <a href="conta.html">Entrar</a></p>
    </section>
  </main>
  <div id="app-footer"></div>
  <script src="common.js"></script>
  <script src="cadastro.js"></script>
</body>
</html>
