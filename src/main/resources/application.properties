spring.application.name=Zona GEO
server.port=8080

# Carrega o arquivo .env da raiz do projeto (ignorado pelo Git), se existir
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/zonageo}
spring.datasource.username=${DB_USERNAME:zonageo}
spring.datasource.password=${DB_PASSWORD:zonageo_dev}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.jackson.time-zone=UTC

# Erros no formato RFC 9457 (campo "detail"), sem stack trace
spring.mvc.problemdetails.enabled=true
server.error.include-message=never
server.error.include-stacktrace=never

# Segredos vêm do ambiente/.env, nunca do código
zonageo.jwt.secret=${ZONAGEO_JWT_SECRET:}
zonageo.jwt.ttl=PT8H
zonageo.admin.user=${ZONAGEO_ADMIN_USER:}
zonageo.admin.password=${ZONAGEO_ADMIN_PASSWORD:}
# true = redefine a senha do admin com o valor acima na próxima inicialização (use só se ficar sem acesso)
zonageo.admin.reset-password=${ZONAGEO_ADMIN_RESET_PASSWORD:false}
zonageo.google.api-key=${GOOGLE_MAPS_API_KEY:}
zonageo.gemini.api-key=${GEMINI_API_KEY:}
zonageo.gemini.model=${GEMINI_MODEL:gemini-flash-latest}
zonageo.seed-demo=${ZONAGEO_SEED_DEMO:false}

# Regras de negócio
zonageo.planos.pro-preco-mensal=9.90
zonageo.voucher.validade-minutos=120
zonageo.voucher.limite-diario=1
zonageo.voucher.raio-validacao-m=500
